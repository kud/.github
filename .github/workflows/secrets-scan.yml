name: Secrets scan

# Reusable: scans the commits a push or pull request brings for credentials,
# with betterleaks' built-in rules plus the URL rules in betterleaks/sensitive.toml.
# A repository with its own .betterleaks.toml or .gitleaks.toml keeps it, so its
# fixture allowlists still apply. Findings are redacted in the log.
#
# Call it from any repository:
#
#   jobs:
#     secrets:
#       uses: kud/.github/.github/workflows/secrets-scan.yml@main

on:
  workflow_call:

permissions:
  contents: read

env:
  BETTERLEAKS_VERSION: "1.10.1"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check out the shared rules
        uses: actions/checkout@v7
        with:
          repository: kud/.github
          path: .shared-github
          sparse-checkout: betterleaks

      - name: Install betterleaks
        run: |
          base="https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}"
          asset="betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$asset" "$base/$asset"
          curl -fsSL -o "$RUNNER_TEMP/checksums.txt" "$base/checksums.txt"
          (cd "$RUNNER_TEMP" && grep " ${asset}\$" checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" betterleaks
          sudo install -m 0755 "$RUNNER_TEMP/betterleaks" /usr/local/bin/betterleaks

      - name: Scan the new commits
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          config=()
          if [ ! -f .betterleaks.toml ] && [ ! -f .gitleaks.toml ]; then
            config=(-c .shared-github/betterleaks/sensitive.toml)
          fi
          zero=0000000000000000000000000000000000000000
          if [ "$EVENT" = pull_request ] && [ -n "$BASE_SHA" ]; then
            range="$BASE_SHA..$HEAD_SHA"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "$zero" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$HEAD_SHA"
          else
            range="$HEAD_SHA"
          fi
          echo "Scanning $range"
          rc=0
          betterleaks git --no-banner --verbose --redact --no-color "${config[@]}" \
            --exit-code 2 --log-opts="$range" || rc=$?
          case $rc in
            0) echo "No secrets found." ;;
            2) echo "::error::A secret was found in these commits. Rewrite them before merging, and rotate the secret if it was pushed anywhere public."; exit 1 ;;
            *) echo "::error::The secrets scan failed to run (exit $rc); this is not a finding."; exit 1 ;;
          esac
